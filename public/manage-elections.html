<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Elections</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="/">Online Voting System</a>
      <div class="navbar-nav ms-auto" id="userNav"></div>
    </div>
  </nav>
  <div class="container mt-4">
    <h2>Manage Elections</h2>
    <form id="electionForm" class="card p-3 mb-4">
      <h5>Create New Election</h5>
      <div class="mb-3">
        <label>Title</label>
        <input type="text" class="form-control" name="title" required>
      </div>
      <div class="mb-3">
        <label>Description</label>
        <textarea class="form-control" name="description"></textarea>
      </div>
      <div class="mb-3">
        <label>Start Time (UTC)</label>
        <input type="datetime-local" class="form-control" name="start_time" required>
      </div>
      <div class="mb-3">
        <label>End Time (UTC)</label>
        <input type="datetime-local" class="form-control" name="end_time" required>
      </div>
      <div class="mb-3">
        <label>Status</label>
        <select class="form-select" name="status">
          <option value="draft">Draft</option>
          <option value="published">Published</option>
          <option value="closed">Closed</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Create Election</button>
    </form>
    <div id="formMessage"></div>
    <a href="/admin-dashboard.html" class="btn btn-secondary">Back</a>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
