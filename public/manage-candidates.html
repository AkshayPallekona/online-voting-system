<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Candidates</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="/">Online Voting System</a>
      <div class="navbar-nav ms-auto" id="userNav"></div>
    </div>
  </nav>
  <div class="container mt-4">
    <h2>Manage Candidates</h2>
    <form id="candidateForm" class="card p-3 mb-4" enctype="multipart/form-data">
      <h5>Add Candidate</h5>
      <div class="mb-3">
        <label>Election ID</label>
        <input type="number" class="form-control" name="election_id" required>
      </div>
      <div class="mb-3">
        <label>Name</label>
        <input type="text" class="form-control" name="name" required>
      </div>
      <div class="mb-3">
        <label>Party Name</label>
        <input type="text" class="form-control" name="party_name">
      </div>
      <div class="mb-3">
        <label>Description</label>
        <textarea class="form-control" name="description"></textarea>
      </div>
      <div class="mb-3">
        <label>Photo (optional)</label>
        <input type="file" class="form-control" name="photo" accept="image/*">
      </div>
      <button type="submit" class="btn btn-primary">Add Candidate</button>
    </form>
    <div id="formMessage"></div>
    <a href="/admin-dashboard.html" class="btn btn-secondary">Back</a>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
